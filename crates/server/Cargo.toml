[package]
name = "server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "novadb-server"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
axum = "0.7"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
