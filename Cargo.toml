[workspace]
resolver = "2"
members = [
    "crates/sql",
    "crates/lang",
    "crates/storage",
    "crates/engine",
    "crates/server",
    "crates/cli",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
